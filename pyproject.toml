[project]
name = "invoice-ingest"
version = "0.1.0"
description = "Invoice OCR + PDF text extraction (Task 1 ingestion)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-openai>=1.3.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # PyMuPDF's SWIG bindings emit these at import; not our code.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pyflakes(F), pycodestyle(E/W), isort(I), pyupgrade(UP), bugbear(B),
# comprehensions(C4), simplify(SIM). Matches the code's existing style.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["invoice_ingest", "tests"]
ignore_missing_imports = true   # fitz, pytesseract, rapidfuzz, langchain ship no stubs
plugins = ["pydantic.mypy"]
